# Supabase project configuration used by the GitHub integration and CLI.
# Functions declared here are auto-deployed to preview branches.

[functions.hcp-jobs]
# Housecall Pro job proxy; requires a signed-in crew member's JWT.
verify_jwt = true

[functions.crew-admin]
# Admin-only crew account management; verifies the caller's admin role.
verify_jwt = true

[functions.proposal-deck]
# Customer-facing proposal deck; access is by unguessable share token.
verify_jwt = false
